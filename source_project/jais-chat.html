<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#101827"><title>OwnedLM – نموذجك العربي</title>
<style>
:root{color-scheme:dark;--bg:#0b1220;--panel:#111c2e;--line:#26354b;--muted:#9aabc2;--accent:#58c6a9}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:#edf4ff;font-family:system-ui,-apple-system,"Segoe UI",sans-serif;height:100dvh;display:flex;justify-content:center}
.app{width:100%;max-width:850px;height:100%;display:flex;flex-direction:column;background:var(--panel)}
header{padding:12px 14px;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.header-actions{display:flex;gap:7px;margin-right:auto}
.header-actions button{padding:9px 11px;font-size:12px;border-radius:10px}
#newChat{background:#244b63;color:#e5f4ff}#deleteChat{background:#5b2932;color:#ffe8eb}
.logo{width:42px;height:42px;border-radius:14px;background:#1d554d;display:grid;place-items:center;color:#a5f3df;font-weight:800;font-size:20px}
h1{font-size:17px;margin:0}header small{color:var(--muted)}
#status{margin-right:auto;font-size:12px;color:var(--muted)}
#chat{flex:1;overflow:auto;padding:20px;display:flex;flex-direction:column;gap:14px}
.welcome{margin:auto;text-align:center;color:var(--muted);max-width:420px;line-height:1.8}.welcome strong{display:block;color:#edf4ff;font-size:22px;margin-bottom:8px}
.msg{max-width:86%;padding:12px 15px;border-radius:17px;white-space:pre-wrap;line-height:1.75;overflow-wrap:anywhere}
.user{align-self:flex-start;background:#214b49;border-bottom-right-radius:5px}.assistant{align-self:flex-end;background:#1a2940;border:1px solid var(--line)}
form{padding:14px;border-top:1px solid var(--line);display:flex;gap:9px;background:#0e1828}
textarea{resize:none;flex:1;min-height:48px;max-height:130px;border:1px solid var(--line);border-radius:14px;background:#152238;color:white;padding:13px;font:inherit;outline:none}
button{border:0;border-radius:14px;background:var(--accent);color:#06251e;font-weight:800;padding:0 20px;font:inherit;cursor:pointer}button:disabled{opacity:.5}
footer{padding:0 16px 10px;color:var(--muted);font-size:11px;text-align:center}
</style></head>
<body><main class="app">
<header><div class="logo">ع</div><div><h1>OwnedLM</h1><small>مساحة المحادثة الخاصة بنموذجك العربي</small></div><span id="status">يفحص الاتصال...</span><div class="header-actions"><button id="newChat" type="button">＋ محادثة جديدة</button><button id="deleteChat" type="button">حذف المحادثة</button></div></header>
<section id="chat" aria-live="polite"><div class="welcome" id="welcome"><strong>هلا بيك 👋</strong>ابدأ محادثتك ويا نموذجك</div></section>
<form id="form"><textarea id="input" rows="1" placeholder="اكتب رسالتك هنا..." required></textarea><button id="send" type="submit">إرسال</button></form>
<footer id="foot">تنبيه: تُحفظ رسائلك على خادم النموذج وتُجمع لإعداد بيانات تحسينه. لا ترسل كلمات مرور أو معلومات شخصية حساسة.</footer>
</main>
<script>
const API = location.origin;
const chat=document.querySelector('#chat'),form=document.querySelector('#form'),input=document.querySelector('#input'),send=document.querySelector('#send'),status=document.querySelector('#status'),foot=document.querySelector('#foot'),newChatBtn=document.querySelector('#newChat'),deleteChatBtn=document.querySelector('#deleteChat');
const STORAGE_KEY='ownedlm_companion_chat_v1';
const SESSION_KEY='ownedlm_session_id_v1';
let sessionId=localStorage.getItem(SESSION_KEY);
if(!sessionId){sessionId=(crypto.randomUUID?crypto.randomUUID():String(Date.now())+'-'+Math.random().toString(36).slice(2));localStorage.setItem(SESSION_KEY,sessionId);}
let messages=[];
try {
  const saved=JSON.parse(localStorage.getItem(STORAGE_KEY)||'[]');
  if(Array.isArray(saved)) messages=saved.filter(m=>m&&['user','assistant'].includes(m.role)&&typeof m.content==='string').slice(-24);
  for(const m of messages) bubble(m.role,m.content);
} catch(e) { messages=[]; }
function saveMessages(){try{localStorage.setItem(STORAGE_KEY,JSON.stringify(messages.slice(-24)))}catch(e){}}
function freshSession(){messages=[];sessionId=(crypto.randomUUID?crypto.randomUUID():String(Date.now())+'-'+Math.random().toString(36).slice(2));localStorage.setItem(SESSION_KEY,sessionId);localStorage.setItem(STORAGE_KEY,'[]');chat.innerHTML='<div class="welcome" id="welcome"><strong>هلا بيك 👋</strong>محادثة جديدة — ابدأ رسالتك</div>';input.value='';status.textContent='محادثة جديدة';input.focus();}
newChatBtn.addEventListener('click',()=>{if(messages.length&&!confirm('تبدأ محادثة جديدة؟ المحادثة الحالية تبقى محفوظة.'))return;freshSession();});
deleteChatBtn.addEventListener('click',async()=>{if(!confirm('تحذف هذه المحادثة نهائياً من الهاتف والسيرفر؟'))return;deleteChatBtn.disabled=true;try{const r=await fetch(API+'/v1/conversations/'+encodeURIComponent(sessionId),{method:'DELETE'});if(!r.ok){let d={};try{d=await r.json()}catch{}throw new Error(d.detail||'تعذر حذف نسخة السيرفر');}freshSession();status.textContent='حُذفت المحادثة من الهاتف والسيرفر';}catch(err){messages=[];localStorage.removeItem(STORAGE_KEY);freshSession();status.textContent='حُذفت محلياً؛ تعذّر تأكيد حذف نسخة السيرفر: '+err.message;}finally{deleteChatBtn.disabled=false;}});
function bubble(role,content){document.querySelector('#welcome')?.remove();const el=document.createElement('div');el.className='msg '+(role==='user'?'user':'assistant');el.textContent=content;chat.appendChild(el);chat.scrollTop=chat.scrollHeight;return el}
async function checkHealth(){try{const r=await fetch(API+'/health');if(!r.ok)throw Error('health');const h=await r.json();status.textContent=h.model_loaded?'متصل — النموذج محمّل':'متصل — وضع التشغيل الأولي';foot.textContent=(h.database_connected?'قاعدة البيانات متصلة وتحفظ المحادثات. ':'قاعدة البيانات غير متصلة. ')+(h.model_loaded?'النموذج المدرّب يعمل.':'النموذج يعمل بالردود الأولية حالياً.')+' تُجمع الرسائل لتحضير بيانات تدريب لاحق.';}catch(e){status.textContent='غير متصل';foot.textContent='تعذّر الوصول إلى خادم النموذج.'}}
form.addEventListener('submit',async e=>{e.preventDefault();const content=input.value.trim();if(!content||send.disabled)return;messages.push({role:'user',content});bubble('user',content);saveMessages();input.value='';send.disabled=true;status.textContent='يعالج الرسالة...';const pending=bubble('assistant','...');try{const response=await fetch(API+'/v1/chat/completions',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({messages,session_id:sessionId,max_new_tokens:100,temperature:.7})});const data=await response.json();if(!response.ok)throw new Error(data.detail||'تعذر تنفيذ الطلب');const answer=data.choices?.[0]?.message?.content;if(!answer)throw new Error('الخادم لم يرجع إجابة');pending.textContent=answer;messages.push({role:'assistant',content:answer});messages=messages.slice(-24);saveMessages();status.textContent=(data.saved_to_database?'حُفظت المحادثة':'تعذّر حفظ المحادثة')+' — '+(data.mode==='trained_model'?'النموذج يعمل':'رد أولي');}catch(err){pending.textContent='تعذّر الحصول على رد: '+err.message;status.textContent='مشكلة اتصال';messages.pop();}finally{send.disabled=false;input.focus()}});
input.addEventListener('keydown',e=>{if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();form.requestSubmit()}});
checkHealth();
</script></body></html>
