name: Train OwnedLM tiny checkpoint

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  train:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out deployment branch
        uses: actions/checkout@v4
        with:
          ref: deploy/deplexo

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install CPU PyTorch
        run: python -m pip install --upgrade pip && python -m pip install torch --index-url https://download.pytorch.org/whl/cpu

      - name: Train tiny model
        run: python train.py --data data/corpus --preset tiny --steps 200 --val-ratio 0.5 --out checkpoints/tiny.pt

      - name: Commit checkpoint to deployment branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f checkpoints/tiny.pt
          if ! git diff --cached --quiet; then
            git commit -m "Add trained OwnedLM tiny checkpoint"
            git push origin HEAD:deploy/deplexo
          else
            echo "Checkpoint is unchanged; no commit needed."
          fi
